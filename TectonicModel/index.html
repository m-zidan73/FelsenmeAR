<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FelsenmeAR — Tectonic Plates</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #111; font-family: sans-serif; }
      canvas { display: block; }
      #info {
        position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
        color: #aaa; font-size: 13px; background: rgba(0,0,0,0.6);
        padding: 6px 14px; border-radius: 20px; pointer-events: none;
      }
      #controls {
        position: absolute; top: 16px; right: 16px;
        background: rgba(0,0,0,0.7); padding: 12px; border-radius: 8px;
        display: flex; flex-direction: column; gap: 8px;
        color: #ccc; font-size: 12px;
      }
      .slider-group { display: flex; align-items: center; gap: 6px; }
      .slider-group span { min-width: 60px; }
      input[type=range] { width: 100px; accent-color: #4af; }
    </style>
  </head>
  <body>
    <div id="info">CapaSuperior · CapaInferior · Magma</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
